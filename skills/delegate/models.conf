# models.conf — ordered fallback chains for the delegate skill (sourced by delegate.sh).
# The script tries each model in order and moves on when one is rate-limited,
# unavailable or stalls. IDs are OpenCode "provider/model" strings.
#
# Free tiers ROTATE. Re-check monthly:
#   delegate.sh models            # which of these does `opencode models` still list?
#   delegate.sh models --probe    # does each one actually answer?
#   opencode models opencode --verbose   # current OpenCode Zen catalog (free = $0)
#   curl -H "Authorization: Bearer $NVIDIA_API_KEY" https://integrate.api.nvidia.com/v1/models
#     (the live NIM list; `opencode models nvidia` is a bundled catalog and lags behind)
# NVIDIA ids that are not in OpenCode's catalog must also be declared under
# provider.nvidia.models in ~/.config/opencode/opencode.json.
#
# Lanes (all free, as probed on 2026-11-20):
#   nvidia/...   NVIDIA build.nvidia.com developer key. ~40 requests/min; trial terms:
#                requests are logged. DeepSeek and Kimi K2.x/K3 are gone from NIM; Kimi K3.1
#                Pro is there now. GLM-5.3 Flash and MiniMax M3.1 Flash were overloaded at
#                probe time (timeout / HTTP 529), so they sit at the tail.
#   opencode/... OpenCode Zen free models (work only inside OpenCode). Rotate often; several
#                use prompts for training. DeepSeek V4.1 Flash is free here now.
#   google/...   Google AI Studio free tier. Enabled only when GEMINI_API_KEY is set (see
#                below). Free-tier prompts may be used by Google to improve its products.
#   selfhost/... Qwen on gn03. Currently OFF (see the bottom).
#
# Put the DIFFERENT model family first for the reviewer: a second lab catches
# mistakes the implementer's family is blind to.

IMPLEMENTER_MODELS=(
  "nvidia/moonshotai/kimi-k3.1-pro"
  "opencode/deepseek-v4.1-flash-free"
  "opencode/beam-free"
  "nvidia/mistralai/mistral-large-4-1t-a52b"
  "nvidia/nvidia/nemotron-3-ultra-550b-a55b"
  "opencode/big-pickle"
  "nvidia/z-ai/glm-5.3-flash"
  "nvidia/minimaxai/minimax-m3.1-flash"
)

REVIEWER_MODELS=(
  "opencode/deepseek-v4.1-flash-free"
  "nvidia/moonshotai/kimi-k3.1-pro"
  "opencode/beam-free"
  "nvidia/mistralai/mistral-large-4-1t-a52b"
  "opencode/mimo-v2.6-flash-free"
)

# Google AI Studio lane: ON when GEMINI_API_KEY is set in ~/.config/delegate/secrets.env.
# Only models the pricing page (aistudio.google.com/docs/pricing, checked 2026-11-20) marks
# "Free of charge" in the Free Tier column: Gemini 4 Hydrogen, Gemini 3.8 Flash, Gemini 3.5
# Flash-Lite. NOT free: Gemini 4 Argon, Carbon, Neon. The "-latest" aliases are not on the
# page, so they are not used. Re-check the page before adding any other Gemini id.
# Free tier = key from a project WITHOUT billing; with billing on, the same calls are charged.
if [[ -n "${GEMINI_API_KEY:-}" ]]; then
  IMPLEMENTER_MODELS=("${IMPLEMENTER_MODELS[@]:0:2}" "google/gemini-4-hydrogen" "${IMPLEMENTER_MODELS[@]:2}" "google/gemini-3.8-flash")
  REVIEWER_MODELS=("${REVIEWER_MODELS[@]:0:1}" "google/gemini-4-hydrogen" "${REVIEWER_MODELS[@]:1}" "google/gemini-3.5-flash-lite")
fi

# Self-hosted fallback: OFF. The cluster caps full-GPU jobs at 24 h and < 4 GPUs per job,
# so there is no always-on Qwen server. To use one later (see extras/qwen/), start the server
# on gn03 and set QWEN_ENABLED=1 in ~/.config/delegate/secrets.env. It is only ever added on
# the node that runs it: elsewhere 127.0.0.1:8000 could be someone else's service.
QWEN_HOST="${QWEN_HOST:-gn03}"
if [[ "${QWEN_ENABLED:-0}" == "1" && "$(hostname -s)" == "$QWEN_HOST" ]]; then
  IMPLEMENTER_MODELS+=("selfhost/qwen-coder")
  REVIEWER_MODELS+=("selfhost/qwen-coder")
fi
